version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workx-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/workx
      JWT_SECRET: ${JWT_SECRET:-changeme}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: workx-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - workx_mongo_data:/data/db

volumes:
  workx_mongo_data:
